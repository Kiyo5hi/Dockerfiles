name: Caddy Cloudflare runtime

on:
  pull_request:
    paths: [caddy-cloudflare/**, .github/workflows/caddy-cloudflare.yml]
  push:
    branches: [main]
    paths: [caddy-cloudflare/**, .github/workflows/caddy-cloudflare.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caddy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and validate both architectures
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: caddy-cloudflare
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/kiyo5hi/caddy-gateway:cloudflare-2.11.8
          cache-from: type=gha,scope=caddy-cloudflare,version=2
          cache-to: type=gha,scope=caddy-cloudflare,version=2,mode=max
      - name: Record immutable publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/kiyo5hi/caddy-gateway@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
